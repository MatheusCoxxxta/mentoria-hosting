# Build -> GHCR -> deploy na VPS da mentoria.
# URL final: https://<PROJETO>.mentoria.seudominio.com
# (o subdomínio vem da chave SSH, fixado pelo mentor; você não o passa aqui.)
#
# Secrets necessários: VPS_HOST, VPS_SSH_KEY, VPS_KNOWN_HOSTS,
#                      DATABASE_USER, DATABASE_NAME, DATABASE_PASSWORD
# (sem APP_ENV multiline: as variáveis do app são montadas abaixo,
#  a partir de valores fixos + secrets discretas.)
name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: vps-deploy
  cancel-in-progress: false

env:
  PORT: "3000"   # porta que o SEU app escuta dentro do container

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Nome da imagem
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}:${GITHUB_SHA}" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .                 # onde está o Dockerfile (use ./subpasta se for monorepo)
          push: true
          tags: ${{ env.IMAGE }}
          platforms: linux/amd64     # linux/arm64 se a VPS for ARM
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: SSH
        env:
          KEY: ${{ secrets.VPS_SSH_KEY }}
          KNOWN: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$KNOWN" > ~/.ssh/known_hosts

      - name: Deploy
        env:
          VPS: ${{ secrets.VPS_HOST }}
          GH_USER: ${{ github.actor }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Variáveis do app, cada uma no seu secret.
          # ATENÇÃO: DATABASE_USER e DATABASE_NAME DEVEM ser o nome do seu projeto
          # (o mesmo do subdomínio). O banco compartilhado cria o role e o database
          # com esse nome; se divergir, o app não acha o banco.
          DATABASE_USER: ${{ secrets.DATABASE_USER }}
          DATABASE_NAME: ${{ secrets.DATABASE_NAME }}
          DATABASE_PASSWORD: ${{ secrets.DATABASE_PASSWORD }}
          # OUTRA_VAR: ${{ secrets.OUTRA_VAR }}
        run: |
          # Monta o .env do container a partir de valores fixos + secrets.
          # stdin: linha1=usuário GHCR, linha2=token GHCR, resto=KEY=VALUE do app.
          {
            printf '%s\n%s\n' "$GH_USER" "$GH_TOKEN"
            printf 'DATABASE_HOST=%s\n'     'db'      # hostname fixo do Postgres compartilhado
            printf 'DATABASE_PORT=%s\n'     '5432'
            printf 'DATABASE_USER=%s\n'     "$DATABASE_USER"
            printf 'DATABASE_NAME=%s\n'     "$DATABASE_NAME"
            printf 'DATABASE_PASSWORD=%s\n' "$DATABASE_PASSWORD"
            printf 'PORT=%s\n'              "$PORT"
            # >>> adicione as demais variáveis do SEU app aqui <<<
            # printf 'OUTRA_VAR=%s\n' "$OUTRA_VAR"
          } | ssh "deployer@$VPS" deploy "$IMAGE" "$PORT"
